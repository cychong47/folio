name: Photolog

options:
  bundleIdPrefix: com.folio
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""  # Fill in your Team ID
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      GCC_PREPROCESSOR_DEFINITIONS:
        - "$(inherited)"
        - "DEBUG=1"
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  Photolog:
    type: application
    platform: macOS
    sources:
      - path: folio
        excludes: []
      - path: Shared
    info:
      path: folio/Info.plist
      properties:
        CFBundleIdentifier: com.folio.app
        CFBundleName: Photolog
        CFBundleDisplayName: Photolog
        CFBundleShortVersionString: "1.21.50"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "13.0"
        NSPrincipalClass: NSApplication
        CFBundleURLTypes:
          - CFBundleURLName: com.folio.app
            CFBundleURLSchemes:
              - folio
        NSPhotoLibraryUsageDescription: "Photolog reads photo dates to set the correct date on your blog posts."
    entitlements:
      path: folio/Folio.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.folio.app
          - group.com.blogger.app
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.personal-information.photos-library: true
    dependencies:
      - sdk: Photos.framework
      - sdk: CoreLocation.framework
      - sdk: Vision.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.folio.app
        PRODUCT_NAME: Photolog
        PRODUCT_MODULE_NAME: Photolog
        INFOPLIST_FILE: folio/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        SDKROOT: macosx
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    preBuildScripts:
      - name: Generate BuildInfo
        script: |
          COMMIT=$(git -C "$SRCROOT" log -1 --format="%h" 2>/dev/null || echo "unknown")
          DATE=$(git -C "$SRCROOT" log -1 --format="%cd" --date=short 2>/dev/null || date +%Y-%m-%d)
          cat > "$SRCROOT/folio/BuildInfo.swift" << EOF
          // Auto-generated by build phase — do not edit manually
          enum BuildInfo {
              static let commitDate = "$DATE"
              static let commitHash = "$COMMIT"
          }
          EOF
        inputFiles:
          - $(SRCROOT)/.git/HEAD
        outputFiles:
          - $(SRCROOT)/folio/BuildInfo.swift

  FolioShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FolioShareExtension
    info:
      path: FolioShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Photolog
        CFBundleShortVersionString: "1.21.50"
        CFBundleVersion: "2"
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 50
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    entitlements:
      path: FolioShareExtension/FolioShareExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.folio.app
          - group.com.blogger.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.folio.app.ShareExtension
        PRODUCT_NAME: PhotologShareExtension
        PRODUCT_MODULE_NAME: PhotologShareExtension
        INFOPLIST_FILE: FolioShareExtension/Info.plist
        COMBINE_HIDPI_IMAGES: YES
        SDKROOT: macosx
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    dependencies:
      - sdk: ImageIO.framework

  PhotologTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PhotologTests
    dependencies:
      - target: Photolog
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.folio.app.tests
        PRODUCT_NAME: PhotologTests
        SDKROOT: macosx
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Photolog.app/Contents/MacOS/Photolog"

schemes:
  Photolog:
    build:
      targets:
        Photolog: all
        FolioShareExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhotologTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
